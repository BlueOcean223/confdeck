[package]
name = "confdeck-app"
description = "confdeck 桌面应用（GPUI）"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# 开发用：`drive` 脚本的 `shot` 命令改用 GPUI 自己把当前帧渲染成图片（gpui 的 test-support），
# 不依赖系统的屏幕录制权限。平时的构建不开。见 notes/ui-testing.md。
shots = ["gpui-kit/test-support"]

[dependencies]
confdeck-core.workspace = true
gpui-kit.workspace = true
tray-icon.workspace = true
async-channel.workspace = true
anyhow.workspace = true
rust-embed.workspace = true
rust-i18n.workspace = true
sys-locale.workspace = true
resvg.workspace = true
image.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
raw-window-handle.workspace = true
