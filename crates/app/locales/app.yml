# 界面文案。`_version: 2`：每个键下面并排写各语言，少写一种语言、代码里用了没有的键，
# `i18n` 模块的测试会报出来。
# 语言代号和 gpui-component 的一致（en、zh-CN），它自带的组件文案才能跟着一起换。
# 变量写 %{name}，代码里 t!("键", name = 值)。以 % 开头的值要加引号，YAML 把 % 当指令符。
_version: 2

tabs:
  agents:
    en: Agents
    zh-CN: Agent
  providers:
    en: Providers
    zh-CN: 供应商
  mcp:
    en: MCP
    zh-CN: MCP
  prompts:
    en: Prompts
    zh-CN: 提示词
  usage:
    en: Usage
    zh-CN: 用量
  sessions:
    en: Sessions
    zh-CN: 会话

common:
  # 选择器和下拉框里的「默认」：交还给 agent 自带的登录。
  default:
    en: Default
    zh-CN: 默认
  # 把几个名字连成一句话时用的分隔符。
  list_separator:
    en: ", "
    zh-CN: "、"
  cancel:
    en: Cancel
    zh-CN: 取消
  save:
    en: Save
    zh-CN: 保存

# 单选 agent 胶囊里的两种特殊状态（预览 09）。
pill:
  custom:
    en: "Custom · %{host}"
    zh-CN: "自定义 · %{host}"
  # 没有地址可显示的接法（Bedrock、Vertex、Codex 内置的 ollama）。
  custom_bare:
    en: Custom
    zh-CN: 自定义
  key_mismatch:
    en: "%{name} · key differs"
    zh-CN: "%{name} · Key 不一致"
  # 配置文件解析不了，认不出连的是哪家。
  unreadable:
    en: Config unreadable
    zh-CN: 配置读不了

agents:
  show_more:
    en: Show %{count} more
    zh-CN: 显示其余 %{count} 个
  show_less:
    en: Show less
    zh-CN: 收起
  no_config:
    en: No config file found
    zh-CN: 未检测到配置文件
  configure:
    en: Configure
    zh-CN: 配置
  # 还没有适配器的 agent（阶段 7）。
  not_supported:
    en: Not supported yet
    zh-CN: 还没接上

providers:
  count_one:
    en: 1 provider
    zh-CN: 1 家供应商
  count_other:
    en: "%{count} providers"
    zh-CN: "%{count} 家供应商"
  # 名字下面：第一个接口的主机名和目录里有几个模型。
  summary_one:
    en: "%{host} · 1 model"
    zh-CN: "%{host} · 1 个模型"
  summary_other:
    en: "%{host} · %{count} models"
    zh-CN: "%{host} · %{count} 个模型"
  no_key:
    en: No key
    zh-CN: 没有 Key
  add:
    en: Add provider
    zh-CN: 添加供应商
  empty:
    en: No providers yet. Add one to get started.
    zh-CN: 还没有供应商，先添加一家
  # providers.json 读不了：列表空着，不许改，不然会把文件盖掉。
  load_error:
    en: "The provider list could not be read. Fix the file before editing: %{error}"
    zh-CN: "供应商列表读不了，先修好文件再改：%{error}"

placeholder:
  not_built:
    en: Prototype stage, this page is not built yet
    zh-CN: 原型阶段，这一页还没做

# 多选 agent 胶囊里的文字：勾了几家。
multi:
  none:
    en: No providers
    zh-CN: 没有供应商
  count_one:
    en: 1 provider
    zh-CN: 1 个供应商
  count_other:
    en: "%{count} providers"
    zh-CN: "%{count} 个供应商"

picker:
  filter:
    en: Filter providers…
    zh-CN: 筛选供应商…
  # 过滤词能匹配到这些词时，「默认」这一项才留在列表里。两种语言的词都放，打哪种都能搜到。
  default_keywords:
    en: default official 默认 官方
    zh-CN: 默认 官方 default official
  default_hint:
    en: Use the login that comes with %{agent}
    zh-CN: 使用 %{agent} 自带的登录
  group:
    en: Providers
    zh-CN: 供应商
  # 多选浮层的两组：打开时已经勾着的，和还能勾的。
  in_config:
    en: In %{agent}'s config
    zh-CN: 写进 %{agent} 的配置
  available:
    en: Available
    zh-CN: 可添加
  # 接口对不上的一组和每行的原因。%{protocols} 是这个 agent 能用的协议，不止一种时用 common.list_separator 连起来。
  incompatible_group:
    en: Not usable
    zh-CN: 用不了
  incompatible:
    en: No %{protocols} endpoint
    zh-CN: 没有 %{protocols} 接口
  # 必须有 Key 的 agent（Claude Code、Codex、Grok Build）遇到没填 Key 的供应商。
  no_key:
    en: No key set
    zh-CN: 没填 Key
  empty:
    en: No matching providers
    zh-CN: 没有匹配的供应商
  # 配置不是 confdeck 写的时候（「自定义 · 主机名」「Key 不一致」），列表最上面的一组：
  # 第一行写现在连到哪，下面挂着能做的动作（decisions「『自定义』的样子」）。有过滤词时不显示。
  now:
    en: Current config
    zh-CN: 当前配置
  # 「自定义」没有地址可显示时（Bedrock、Vertex、Codex 内置的 ollama）的小字；有地址时小字就是地址。
  other_setup:
    en: Bedrock, Vertex, a built-in provider or similar
    zh-CN: Bedrock、Vertex、内置供应商这类接法
  # 「Key 不一致」的小字，按文件里的凭据分：有 Key 但不一样、没写、由命令取、在环境变量里。
  key_differs:
    en: The file's key is not the one confdeck has
    zh-CN: 文件里的 Key 和 confdeck 存的不一样
  key_missing:
    en: The file has no key in it
    zh-CN: 文件里没写 Key
  key_helper:
    en: The key comes from a command; confdeck can't read it
    zh-CN: Key 由命令取，confdeck 读不到
  key_env:
    en: Key is in $%{var}, not readable
    zh-CN: Key 在环境变量 %{var} 里，读不到
  # 动作行。
  rewrite:
    en: Rewrite with confdeck's key for %{name}
    zh-CN: 用 confdeck 里 %{name} 的 Key 重写
  adopt_key:
    en: Save the file's key into %{name}
    zh-CN: 把文件里的 Key 存进 %{name}
  save_as:
    en: Save the current setup as a provider…
    zh-CN: 把当前配置存成供应商…
  # 配置不是 confdeck 写的时候，供应商那组的标题多说一句。
  group_providers:
    en: Providers
    zh-CN: 供应商

panel:
  open:
    en: Open confdeck
    zh-CN: 打开 confdeck
  quit:
    en: Quit
    zh-CN: 退出

tray:
  open:
    en: Open confdeck
    zh-CN: 打开 confdeck
  quit:
    en: Quit confdeck
    zh-CN: 退出 confdeck

# 供应商的弹层编辑器。
editor:
  title_new:
    en: New provider
    zh-CN: 新供应商
  in_use:
    en: In use
    zh-CN: 在用
  name:
    en: Name
    zh-CN: 名字
  id:
    en: ID
    zh-CN: ID
  id_hint_new:
    en: Can't be changed after saving
    zh-CN: 保存后不能改
  key:
    en: Key
    zh-CN: Key
  key_placeholder:
    en: sk-…
    zh-CN: sk-…
  key_show:
    en: Show
    zh-CN: 显示
  key_hide:
    en: Hide
    zh-CN: 隐藏
  key_hint_in_use:
    en: "Changes sync to %{agents}"
    zh-CN: "改了会同步到 %{agents}"
  endpoints:
    en: Endpoints
    zh-CN: 接口地址
  endpoints_hint:
    en: Leave empty if the protocol isn't supported
    zh-CN: 留空则表示不支持该协议
  not_offered:
    en: Not offered
    zh-CN: 不提供
  models:
    en: Models
    zh-CN: 模型目录
  models_empty:
    en: No models yet
    zh-CN: 还没有模型
  default_model:
    en: Default model
    zh-CN: 默认模型
  add_model:
    en: Add model
    zh-CN: 添加模型
  model_id:
    en: Model ID
    zh-CN: 模型 ID
  model_name:
    en: Display name (optional)
    zh-CN: 显示名（可不填）
  model_unnamed:
    en: (no ID yet)
    zh-CN: （还没填 ID）
  model_no_details:
    en: No details
    zh-CN: 没有详情
  context:
    en: Context
    zh-CN: 上下文
  output:
    en: Max output
    zh-CN: 输出上限
  image:
    en: image
    zh-CN: 图像
  image_input:
    en: Accepts image input
    zh-CN: 接受图像输入
  reasoning:
    en: Reasoning
    zh-CN: 推理档位
  reasoning_placeholder:
    en: "low, high (empty = none)"
    zh-CN: "low, high（空着 = 不支持）"
  reasoning_line:
    en: "reasoning %{levels}"
    zh-CN: "推理 %{levels}"
  remove_model:
    en: Remove model
    zh-CN: 删掉这个模型
  footer_hint:
    en: Changes sync to the agents using this provider
    zh-CN: 保存后同步到在用的 agent
  delete:
    en: Delete
    zh-CN: 删除
  discard_title:
    en: Discard changes?
    zh-CN: 放弃改动？
  discard_body:
    en: This provider has unsaved changes.
    zh-CN: 这家供应商改了还没保存。
  discard:
    en: Discard
    zh-CN: 放弃
  keep_editing:
    en: Keep editing
    zh-CN: 继续编辑
  delete_title:
    en: "Delete %{name}?"
    zh-CN: "删除 %{name}？"
  delete_unused:
    en: No agent is using it.
    zh-CN: 没有 agent 在用它。
  delete_used_by:
    en: "These agents are using it:"
    zh-CN: 这几个 agent 在用它：
  delete_switch_note:
    en: "%{agents}: the config file is left alone and will show as Custom · %{host}"
    zh-CN: "%{agents} 的文件不动，之后显示「自定义 · %{host}」"
  delete_coexist_note:
    en: "%{agents}: this provider's entry is removed"
    zh-CN: "%{agents} 里的这一项会删掉"
  delete_unknown:
    en: "%{agent}: could not read its config, so it is unknown whether it uses this provider: %{error}"
    zh-CN: "%{agent} 的配置读不了，不知道在不在用：%{error}"

# 校验错误（core 的 ProviderError）。
errors:
  bad_id:
    en: The ID may only use lowercase letters, digits and hyphens, and may not start or end with a hyphen
    zh-CN: ID 只能用小写字母、数字和连字符，不能以连字符开头或结尾
  duplicate_id:
    en: "The ID %{id} is already taken"
    zh-CN: "ID %{id} 已经有了"
  empty_name:
    en: The name is empty
    zh-CN: 名字不能空
  no_endpoint:
    en: Fill in at least one endpoint
    zh-CN: 至少填一个接口地址
  bad_url:
    en: "The %{protocol} endpoint is not an http(s) URL: %{url}"
    zh-CN: "%{protocol} 地址不是 http(s) 地址：%{url}"
  empty_model_id:
    en: A model has no ID
    zh-CN: 有个模型没填 ID
  duplicate_model:
    en: "The model %{model} appears more than once"
    zh-CN: "模型 %{model} 出现了不止一次"
  unknown_model:
    en: "The override for %{agent} uses %{model}, which is not in the catalog"
    zh-CN: "给 %{agent} 的覆盖用了目录里没有的模型 %{model}"
  unknown_default_model:
    en: "The default model %{model} is not in the catalog"
    zh-CN: "默认模型 %{model} 不在目录里"

# 保存、删除以后的提示。
toast:
  saved:
    en: "Saved %{name}"
    zh-CN: "已保存 %{name}"
  saved_synced:
    en: "Saved · synced to %{agents}"
    zh-CN: "已保存 · 同步到 %{agents}"
  deleted:
    en: "Deleted %{name}"
    zh-CN: "已删除 %{name}"
  deleted_synced:
    en: "Deleted · removed from %{agents}"
    zh-CN: "已删除 · 从 %{agents} 里移掉"
  sync_failed:
    en: "%{agent} was not written: %{error}"
    zh-CN: "%{agent} 没写成：%{error}"

# 选了一家以后的提示（主窗口的提示条、面板的底栏）：只说换成了什么，不说写了哪个文件（用户 10-11：太啰嗦）。
write:
  switched:
    en: "%{agent} now uses %{provider}"
    zh-CN: "%{agent} 已切到 %{provider}"
  restored:
    en: "%{agent} is back to its own login"
    zh-CN: "%{agent} 已还原成默认"
  enabled:
    en: "%{provider} added to %{agent}"
    zh-CN: "%{agent} 勾上了 %{provider}"
  disabled:
    en: "%{provider} removed from %{agent}"
    zh-CN: "%{agent} 去掉了 %{provider}"
  # 「Key 不一致」时把文件里的 Key 存进这家：这个 agent 的文件不用写，别的在用这家的 agent 跟着换。
  key_adopted:
    en: "%{provider} now has the key from %{agent}'s config"
    zh-CN: "%{provider} 的 Key 换成了 %{agent} 配置里的"
  key_adopted_synced:
    en: "%{provider} now has the key from %{agent}'s config · synced to %{agents}"
    zh-CN: "%{provider} 的 Key 换成了 %{agent} 配置里的 · 同步到 %{agents}"
  key_adopt_failed:
    en: "Could not save the key into %{provider}: %{error}"
    zh-CN: "没能把 Key 存进 %{provider}：%{error}"
  # 「配置 ›」页：改了模型以后写进了这个 agent 的文件；原始文件保存好了。
  updated:
    en: "%{agent} updated"
    zh-CN: "%{agent} 已更新"
  file_saved:
    en: "Saved %{file}"
    zh-CN: "已保存 %{file}"
  # 设置 › 备份：恢复了一份、清理了几份。
  file_restored:
    en: "Restored %{file}"
    zh-CN: "已恢复 %{file}"
  cleaned_one:
    en: "Removed 1 backup"
    zh-CN: "清理了 1 份"
  cleaned_other:
    en: "Removed %{count} backups"
    zh-CN: "清理了 %{count} 份"
  codex_catalog_skipped:
    en: "Codex model catalog not written (%{reason}): /model still lists GPT models and this provider's models get a 272K window"
    zh-CN: "Codex 的模型目录没写成（%{reason}）：/model 列的还是 GPT 模型，这家的模型按 272K 窗口算"
  codex_catalog_refreshed:
    en: "Codex model catalog rewritten for the installed Codex (%{file})"
    zh-CN: "按本机的 Codex 重写了模型目录（%{file}）"
  codex_catalog_refresh_failed:
    en: "Could not refresh the Codex model catalog: %{reason}. The old one still works"
    zh-CN: "没能按本机的 Codex 重写模型目录：%{reason}。旧目录照样能用"

# Codex 模型目录没生成出来的三种原因（core 的 `Skipped`），填进上面 write.codex_* 的 %{reason}。
codex:
  not_found:
    en: codex was not found
    zh-CN: 没找到 codex
  failed:
    en: "`codex debug models --bundled` did not run"
    zh-CN: "codex debug models --bundled 没跑成"
  no_template:
    en: none of Codex's built-in models can serve as a template
    zh-CN: Codex 内置的模型里挑不出能照着写的

# 添加供应商的预设卡片表。
add:
  title:
    en: Add provider
    zh-CN: 添加供应商
  search:
    en: Find a provider…
    zh-CN: 找一家…
  domestic:
    en: China
    zh-CN: 国内
  overseas:
    en: International
    zh-CN: 海外站
  relay:
    en: Relays
    zh-CN: 中转
  custom_group:
    en: Your own
    zh-CN: 自己填
  custom:
    en: Custom
    zh-CN: 自定义
  custom_hint:
    en: Any compatible endpoint
    zh-CN: 任意兼容的地址
  added:
    en: Added
    zh-CN: 已加
  empty:
    en: No matching presets
    zh-CN: 没有匹配的预设

# 「配置 ›」页（decisions「配置页」）：一个 agent 用当前这家时写什么。卡片标题一个词，没有说明条。
config:
  models:
    en: Models
    zh-CN: 模型
  # Claude Code 的六个槽位（core 的 claude::SLOTS）。
  slot_main:
    en: Main model
    zh-CN: 主模型
  slot_opus:
    en: Opus
    zh-CN: Opus
  slot_sonnet:
    en: Sonnet
    zh-CN: Sonnet
  slot_fable:
    en: Fable
    zh-CN: Fable
  slot_haiku:
    en: Haiku
    zh-CN: Haiku
  slot_subagent:
    en: Subagent
    zh-CN: 子代理
  # 有改过的槽位时才出现，点了清掉这个 agent 对这家的 slots。
  reset_slots:
    en: Reset
    zh-CN: 恢复默认
  # 下拉框和列表底下手填目录里没有的模型，回车加进目录。
  other_model:
    en: Another model…
    zh-CN: 其他模型…
  # 多选 agent 每家一块，头上的小字：几个模型、走哪种接口。
  count_one:
    en: 1 model
    zh-CN: 1 个模型
  count_other:
    en: "%{count} models"
    zh-CN: "%{count} 个模型"
  protocol:
    en: Protocol
    zh-CN: 接口
  # 槽位下拉框的第一项：不写这个环境变量（用户 10-12：模型不是必填的）。
  leave_empty:
    en: None
    zh-CN: 留空
  raw_file:
    en: Raw file
    zh-CN: 原始文件
  open:
    en: Open
    zh-CN: 打开
  # 原始文件编辑框的「格式化」（⌥⇧F）。
  format:
    en: Format
    zh-CN: 格式化

# 设置页（顶栏的齿轮）：设一次就不动的开关，按 agent 分组，现在只有 Claude Code 一组（decisions「配置页」）。
settings:
  title:
    en: Settings
    zh-CN: 设置
  # ~/.claude.json 的 hasCompletedOnboarding：装好以后第一次打开 Claude Code 的那几步确认。
  skip_onboarding:
    en: Skip first-run setup
    zh-CN: 跳过首次确认
  # ~/.claude/config.json 的 primaryApiKey = "any"：VS Code 插件也用 settings.json 里的地址和 Key。
  vscode_follows:
    en: Switch the VS Code extension too
    zh-CN: VS Code 插件跟着切换
  # settings.json 的 includeCoAuthoredBy = false：提交里不带「Co-Authored-By: Claude」。
  # 开关说「隐藏」（用户 10-12：Claude Code 默认带着，开关是改默认，和另外两个一样）。
  hide_attribution:
    en: Hide the AI byline in commits
    zh-CN: 隐藏 AI 署名
  # 设置 › 备份（decisions「备份」）。
  backups:
    en: Backups
    zh-CN: 备份
  no_backups:
    en: No backups yet
    zh-CN: 还没有备份
  count_one:
    en: 1 backup
    zh-CN: 1 份
  count_other:
    en: "%{count} backups"
    zh-CN: "%{count} 份"
  diff:
    en: Diff
    zh-CN: 差异
  restore:
    en: Restore
    zh-CN: 恢复
  # 删掉原件以外的备份。
  clean:
    en: Clean up
    zh-CN: 清理
  same_as_now:
    en: Same as now
    zh-CN: 和现在一样
  skipped_one:
    en: "⋯ 1 line"
    zh-CN: "⋯ 1 行"
  skipped_other:
    en: "⋯ %{count} lines"
    zh-CN: "⋯ %{count} 行"

# 备份的原因（core 的 backup::Reason，文件名里是英文词）。
backup:
  original:
    en: Original
    zh-CN: 原件
  external:
    en: Changed outside
    zh-CN: 外部改过
  before_edit:
    en: Before editing
    zh-CN: 手改前
  before_restore:
    en: Before restoring
    zh-CN: 恢复前
  before_save:
    en: Before saving
    zh-CN: 保存前
