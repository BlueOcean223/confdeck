    zh-CN: 接口
  base_url:
    en: Base URL
    zh-CN: 地址
  protocols:
    en: Protocols
    zh-CN: 协议
  # 展开后各协议地址框右边的按钮。
  endpoint_remove:
    en: Not offered
    zh-CN: 不提供
  endpoint_add:
    en: Fill from base URL
    zh-CN: 按地址填上
  not_offered:
    en: Not offered
    zh-CN: 不提供
  models:
    en: Models
    zh-CN: 模型目录
  models_empty:
    en: No models yet
    zh-CN: 还没有模型
  default_model:
    en: Default model
    zh-CN: 默认模型
  add_model:
    en: Add model
    zh-CN: 添加模型
  model_id:
    en: Model ID
    zh-CN: 模型 ID
  model_name:
    en: Display name (optional)
    zh-CN: 显示名（可不填）
  model_unnamed:
    en: (no ID yet)
    zh-CN: （还没填 ID）
  model_no_details:
    en: No details
    zh-CN: 没有详情
  context:
    en: Context
    zh-CN: 上下文
  output:
    en: Max output
    zh-CN: 输出上限
  image:
    en: image
    zh-CN: 图像
  image_input:
    en: Accepts image input
    zh-CN: 接受图像输入
  reasoning:
    en: Reasoning
    zh-CN: 推理档位
  reasoning_none:
    en: "None"
    zh-CN: 不支持
  reasoning_line:
    en: "reasoning %{levels}"
    zh-CN: "推理 %{levels}"
  remove_model:
    en: Remove model
    zh-CN: 删掉这个模型
  ping:
    en: Ping
    zh-CN: 测速
  pinging:
    en: Pinging…
    zh-CN: 测速中…
  # 从这家的接口拉模型列表，勾要加进目录的。
  fetch:
    en: Fetch
    zh-CN: 拉取
  fetching:
    en: Fetching…
    zh-CN: 拉取中…
  # 按预设和 models.dev 补目录里空着的参数。
  fill:
    en: Fill in
    zh-CN: 补全
  filling:
    en: Filling in…
    zh-CN: 补全中…
  filled_none:
    en: Nothing to fill in
    zh-CN: 没有可补的
  filled_one:
    en: Filled in 1 model
    zh-CN: 补全了 1 个模型
  filled_other:
    en: "Filled in %{count} models"
    zh-CN: "补全了 %{count} 个模型"
  added_one:
    en: Added 1 model
    zh-CN: 加了 1 个模型
  added_other:
    en: "Added %{count} models"
    zh-CN: "加了 %{count} 个模型"
  pick_filter:
    en: Search
    zh-CN: 搜索
  pick_none:
    en: No matches
