  pick_add_one:
    en: Add 1 model
    zh-CN: 加入 1 个
  pick_add_other:
    en: "Add %{count} models"
    zh-CN: "加入 %{count} 个"
  # 价格：美元 / 百万 token，框右边写着 $/M。
  price_input:
    en: Input
    zh-CN: 输入价格
  price_output:
    en: Output
    zh-CN: 输出价格
  price_cache_read:
    en: Cache read
    zh-CN: 缓存读取
  price_cache_write:
    en: Cache write
    zh-CN: 缓存写入
  footer_hint:
    en: Changes sync to the agents using this provider
    zh-CN: 保存后同步到在用的 agent
  delete:
    en: Delete
    zh-CN: 删除
  discard_title:
    en: Discard changes?
