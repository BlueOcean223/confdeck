    zh-CN: 新供应商
  in_use:
    en: In use
    zh-CN: 在用
  name:
    en: Name
    zh-CN: 名字
  id:
    en: ID
    zh-CN: ID
  id_hint_new:
    en: Can't be changed after saving
    zh-CN: 保存后不能改
  key:
    en: Key
    zh-CN: Key
  key_placeholder:
    en: sk-…
    zh-CN: sk-…
  key_show:
    en: Show
    zh-CN: 显示
  key_hide:
    en: Hide
    zh-CN: 隐藏
  key_hint_in_use:
    en: "Changes sync to %{agents}"
    zh-CN: "改了会同步到 %{agents}"
  # 接口：一个公共地址，各协议的地址默认按它填，收在「协议」一行里（用户 10-12）。
  endpoints:
