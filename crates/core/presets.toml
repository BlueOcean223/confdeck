anthropic = "https://ark.ap-southeast.bytepluses.com/api/coding"
openai-chat = "https://ark.ap-southeast.bytepluses.com/api/coding/v3"
openai-responses = "https://ark.ap-southeast.bytepluses.com/api/coding/v3"

[[presets.models]]
id = "ark-code-latest"
name = "Ark Code Latest"
star = true
tier = "flagship"
context = 256000
reasoning = ["low", "medium", "high"]

# 硅基流动。Anthropic 和 Chat 两种协议，没有 Responses，Codex 用不了（官方 Codex 接入文档）。Anthropic 接口不限模型
# （api-docs.siliconflow.cn/docs/api/messages-post，10-10）。模型目录只放 DeepSeek V4 两个，其余的以后从供应商拉；
# 上下文按 1M、输出上限按 DeepSeek 官方的 384K 记。推理档位不写：没核实硅基流动收不收 effort。
[[presets]]
id = "siliconflow"
name = "硅基流动"
website = "https://siliconflow.cn"
key_url = "https://cloud.siliconflow.cn/account/ak"

[presets.endpoints]
anthropic = "https://api.siliconflow.cn"
openai-chat = "https://api.siliconflow.cn/v1"

[[presets.models]]
id = "deepseek-ai/DeepSeek-V4-Pro"
name = "DeepSeek V4 Pro"
star = true
tier = "flagship"
context = 1000000
output = 384000
input = ["text"]

[[presets.models]]
id = "deepseek-ai/DeepSeek-V4-Flash"
name = "DeepSeek V4 Flash"
star = true
tier = "fast"
context = 1000000
output = 384000
input = ["text"]

# SiliconFlow（硅基流动海外站）：和国内站一样，域名是 api.siliconflow.com（ccs-lite 的 Claude Code 预设、models.dev 的 siliconflow）。
[[presets]]
id = "siliconflow-intl"
name = "SiliconFlow"
website = "https://siliconflow.com"
key_url = "https://cloud.siliconflow.com/account/ak"

[presets.endpoints]
anthropic = "https://api.siliconflow.com"
openai-chat = "https://api.siliconflow.com/v1"

[[presets.models]]
id = "deepseek-ai/DeepSeek-V4-Pro"
name = "DeepSeek V4 Pro"
star = true
tier = "flagship"
context = 1000000
output = 384000
input = ["text"]

[[presets.models]]
id = "deepseek-ai/DeepSeek-V4-Flash"
name = "DeepSeek V4 Flash"
star = true
tier = "fast"
context = 1000000
output = 384000
input = ["text"]

# OpenRouter。Claude 模型走 Anthropic 协议（ccs-lite 的 Pi、OpenCode 预设都这么配）；主模型用 Sonnet（ccs-lite 的 Claude Code 预设）。
# Codex 默认用 GPT、Grok 默认用 Grok（ccs-lite 的 Codex、Grok Build 预设，2026-10-07 对过 OpenRouter 的模型列表），
# 这两个不打星，Pi、OpenCode 只列 Claude 的。推理档位按 OpenRouter 统一的 reasoning.effort（low / medium / high）。
# 上下文、输出上限、输入类型 10-10 对过 openrouter.ai/api/v1/models（`context_length`、`top_provider.max_completion_tokens`）。
[[presets]]
id = "openrouter"
name = "OpenRouter"
website = "https://openrouter.ai"
key_url = "https://openrouter.ai/keys"

[presets.endpoints]
anthropic = "https://openrouter.ai/api"
openai-chat = "https://openrouter.ai/api/v1"
openai-responses = "https://openrouter.ai/api/v1"

[[presets.models]]
id = "anthropic/claude-opus-5.5"
name = "Claude Opus 5.5"
star = true
tier = "flagship"
context = 1000000
output = 128000
input = ["text", "image"]
reasoning = ["low", "medium", "high"]

[[presets.models]]
id = "anthropic/claude-sonnet-5.5"
name = "Claude Sonnet 5.5"
star = true
tier = "balanced"
context = 1000000
output = 128000
input = ["text", "image"]
reasoning = ["low", "medium", "high"]

[[presets.models]]
id = "anthropic/claude-haiku-5.5"
name = "Claude Haiku 5.5"
star = true
tier = "fast"
context = 1000000
output = 128000
input = ["text", "image"]
reasoning = ["low", "medium", "high"]

[[presets.models]]
id = "anthropic/claude-fable-5.1"
name = "Claude Fable 5.1"
tier = "flagship"
context = 1000000
output = 128000
input = ["text", "image"]
reasoning = ["low", "medium", "high"]

[[presets.models]]
id = "openai/gpt-6.1-sol"
name = "GPT-6.1 Sol"
tier = "flagship"
context = 1050000
output = 128000
input = ["text", "image"]
reasoning = ["low", "medium", "high"]

[[presets.models]]
id = "x-ai/grok-4.7"
name = "Grok 4.7"
tier = "flagship"
context = 500000
output = 450000
input = ["text", "image"]
reasoning = ["low", "medium", "high"]

[presets.agents.claude-code.slots]
main = "anthropic/claude-sonnet-5.5"
sonnet = "anthropic/claude-sonnet-5.5"
fable = "anthropic/claude-fable-5.1"

[presets.agents.codex]
default_model = "openai/gpt-6.1-sol"

[presets.agents.grok-build]
default_model = "x-ai/grok-4.7"

[presets.agents.pi]
protocol = "anthropic"

[presets.agents.opencode]
protocol = "anthropic"
