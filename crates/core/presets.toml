# 内置的供应商预设，编进程序里（`crate::preset`）。
#
# 每家一项：地址、模型目录、给各 agent 的推荐值（`agents.<agent>`）。用预设新建供应商时，地址和模型目录照抄进去，
# 推荐值不抄、写配置文件时现查，排在用户的覆盖和自动之间。推荐值只写和自动结果不一样的：
# 自动的规则是协议按 agent 的偏好顺序、默认模型取目录第一个、槽位全填默认模型、列表写整个目录。每家第一个模型就是默认模型。
#
# 数据来源：ccs-lite（BlueOcean223/cc-switch）各 agent 的预设，它们 2026-08～10 对着官方文档核对过、不少用真 Key 试过；
# 模型的上下文、档位优先取它的 Codex 预设（照抄各家官方的 Codex 模型目录）。各家的出处写在注释里。

# DeepSeek 开放平台。三种协议都有：Anthropic 在 /anthropic 子路径，Chat 在 /v1，
# Responses 直接挂在根上（官方 Codex 文档 api-docs.deepseek.com → agent_integrations/codex，ccs-lite 2026-08-15 复核）。
[[presets]]
id = "deepseek"
name = "DeepSeek"
website = "https://platform.deepseek.com"
key_url = "https://platform.deepseek.com/api_keys"

[presets.endpoints]
anthropic = "https://api.deepseek.com/anthropic"
openai-chat = "https://api.deepseek.com/v1"
openai-responses = "https://api.deepseek.com"

[[presets.models]]
id = "deepseek-v4-pro"
name = "DeepSeek V4 Pro"
context = 1048576
output = 384000
input = ["text"]
reasoning = ["low", "high", "max"]

[[presets.models]]
id = "deepseek-flash"
name = "DeepSeek V4.1 Flash"
context = 1048576
output = 384000
input = ["text", "image"]
reasoning = ["low", "high", "max"]

# 官方 Codex 文档推荐 deepseek-flash。
[presets.agents.codex]
default_model = "deepseek-flash"

