# 内置的供应商预设，编进程序里（`crate::preset`）。
#
# 每家一项：地址、模型目录、给各 agent 的推荐值（`agents.<agent>`）。用预设新建供应商时，地址和模型目录照抄进去，
# 推荐值不抄、写配置文件时现查，排在用户的覆盖和自动之间。推荐值只写和自动结果不一样的：
# 自动的规则是协议按 agent 的偏好顺序、槽位强的取最强的（档位高、打星的在前）快的取快速档、列表取打星的、默认取最强的。
#
# 数据来源：ccs-lite（BlueOcean223/cc-switch）各 agent 的预设，它们 2026-08～10 对着官方文档核对过、不少用真 Key 试过；
# 模型的上下文、档位优先取它的 Codex 预设（照抄各家官方的 Codex 模型目录）。各家的出处写在注释里。

# DeepSeek 开放平台。三种协议都有：Anthropic 在 /anthropic 子路径，Chat 在 /v1，
# Responses 直接挂在根上（官方 Codex 文档 api-docs.deepseek.com → agent_integrations/codex，ccs-lite 2026-08-15 复核）。
[[presets]]
id = "deepseek"
name = "DeepSeek"
website = "https://platform.deepseek.com"
key_url = "https://platform.deepseek.com/api_keys"

[presets.endpoints]
anthropic = "https://api.deepseek.com/anthropic"
openai-chat = "https://api.deepseek.com/v1"
openai-responses = "https://api.deepseek.com"

[[presets.models]]
id = "deepseek-v4-pro"
name = "DeepSeek V4 Pro"
star = true
tier = "flagship"
context = 1048576
output = 384000
input = ["text"]
reasoning = ["low", "high", "max"]

[[presets.models]]
id = "deepseek-flash"
name = "DeepSeek V4.1 Flash"
star = true
tier = "fast"
context = 1048576
output = 384000
input = ["text", "image"]
reasoning = ["low", "high", "max"]

# 官方 Codex 文档推荐 deepseek-flash。
[presets.agents.codex]
default_model = "deepseek-flash"

# Kimi 开放平台（按量）。Responses 和 Chat 同一个地址（platform.kimi.com/docs/guide/codex-kimi.md）；
# Claude Code 主模型 K3、Haiku 用 K2.7 Code（platform.kimi.com/docs/guide/claude-code-kimi，2026-10），和自动填的一样。
[[presets]]
id = "kimi"
name = "Kimi"
website = "https://platform.kimi.com"
key_url = "https://platform.kimi.com/console/api-keys"

[presets.endpoints]
anthropic = "https://api.moonshot.cn/anthropic"
openai-chat = "https://api.moonshot.cn/v1"
openai-responses = "https://api.moonshot.cn/v1"

[[presets.models]]
id = "kimi-k3"
name = "Kimi K3"
star = true
tier = "flagship"
context = 1048576
output = 131072
input = ["text", "image"]
reasoning = ["low", "high", "max"]

[[presets.models]]
id = "kimi-k2.7-code"
name = "Kimi K2.7 Code"
star = true
tier = "fast"
context = 262144
output = 262144
input = ["text", "image"]
reasoning = ["high"]

[[presets.models]]
id = "kimi-k2.7-code-highspeed"
name = "Kimi K2.7 Code HighSpeed"
tier = "fast"
context = 262144
output = 262144
input = ["text", "image"]
reasoning = ["high"]

# Kimi For Coding（会员订阅）。Responses 在 /coding/v1（kimi.com/code/docs/third-party-tools/codex.html），
# Chat 同一个地址（ccs-lite 的 OpenClaw 预设），Anthropic 在 /coding。
# 官方 Claude Code 配置所有槽位都用 kimi-for-coding；Pi、OpenCode 走 Anthropic（ccs-lite 的这两个预设都这么配）。
[[presets]]
id = "kimi-coding"
name = "Kimi For Coding"
website = "https://www.kimi.com/code/"
key_url = "https://www.kimi.com/code/console"

[presets.endpoints]
anthropic = "https://api.kimi.com/coding"
openai-chat = "https://api.kimi.com/coding/v1"
openai-responses = "https://api.kimi.com/coding/v1"

# 2026-09-15 起是 K2.8 Preview，最高 1M 上下文（官方 Codex 指南）；输出上限取 ccs-lite Pi 预设的 32768。
[[presets.models]]
id = "kimi-for-coding"
name = "Kimi For Coding"
star = true
tier = "flagship"
context = 1048576
output = 32768
input = ["text", "image"]
reasoning = ["low", "high", "max"]

[[presets.models]]
id = "kimi-for-coding-highspeed"
name = "Kimi For Coding HighSpeed"
tier = "fast"
context = 262144
reasoning = ["high"]

# K3 的 1M 上下文要看会员档位，k3-256k 固定 256K。
[[presets.models]]
id = "k3"
name = "Kimi K3"
tier = "flagship"
context = 1048576
reasoning = ["low", "high", "max"]

[[presets.models]]
id = "k3-256k"
name = "Kimi K3 256K"
tier = "flagship"
context = 262144
reasoning = ["low", "high", "max"]

[presets.agents.claude-code.slots]
haiku = "kimi-for-coding"
subagent = "kimi-for-coding"

[presets.agents.pi]
protocol = "anthropic"

[presets.agents.opencode]
protocol = "anthropic"

