[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
confdeck-core = { path = "crates/core" }

gpui-kit = "0.7"
tray-icon = "0.26"
async-channel = "2"
rust-embed = "8.7"
# 和 gpui 用同一个版本，不多编译一份；只用来把图标渲染成菜单栏图标。
resvg = { version = "0.46", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSScreen", "NSView", "NSWindow", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
raw-window-handle = "0.6"

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
toml_edit = "0.22"
