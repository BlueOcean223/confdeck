[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
confdeck-core = { path = "crates/core" }

gpui-kit = "0.7"
tray-icon = "0.26"
async-channel = "2"
rust-embed = "8.7"
# 界面文案的多语言。gpui-component 也用它，「当前语言」是进程级的一份，设一次两边的文案都换。
rust-i18n = "4.2"
# 读系统的首选语言，启动时定界面语言。
sys-locale = "0.3"
# 和 gpui 用同一个版本，不多编译一份；只用来把图标渲染成菜单栏图标。
resvg = { version = "0.46", default-features = false }
# 解码 PNG 品牌图标、按显示尺寸缩小。版本要和 gpui 用的一致（RenderImage 收的是它的 Frame）。
image = { version = "0.25", default-features = false, features = ["png"] }
objc2 = "0.6"
# 给 NSNotificationCenter 传回调（面板打开时主窗口留在原位，`mac::stay_behind_on_activation`）。和 objc2 0.6 配套的版本。
block2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSScreen", "NSView", "NSWindow", "NSResponder", "NSApplication", "NSAppearance"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
raw-window-handle = "0.6"

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
# Pi 的 models.json 允许注释和尾逗号，按 JSON5 读。
json5 = "1"
# 改写 JSON5 / JSONC 文件时保留注释和排版（round-trip 语法树）。
json-five = { version = "0.3.1", default-features = false }
# 写入引擎：文件内容的 hash、备份文件名里的本地时间。
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tempfile = "3"
toml_edit = "0.22"
# confdeck 自己发出去的请求（拉模型列表、测连通、下 models.dev），在后台线程上用阻塞的客户端。
# 不用默认的 rustls（aws-lc-rs 要编一大截 C）：native-tls 在 macOS 上是系统的 Security.framework，信任钥匙串里装的证书。
# system-proxy：没设代理时跟着环境变量和系统的代理设置走。
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls", "http2", "system-proxy", "socks", "gzip"] }
# 用量缓存（`~/.confdeck/cache/usage.db`）。bundled：自带 SQLite，不依赖系统装的版本。
rusqlite = { version = "0.31", features = ["bundled"] }
# 设置页显示「跟随系统」现在走的是哪个代理：和 reqwest 用的是同一个函数。
hyper-util = { version = "0.1", features = ["client-proxy", "client-proxy-system"] }
http = "1"

# 调试构建里依赖也优化：不优化时 GPUI 的布局（taffy）一帧要 8～10 毫秒，滚动明显卡；优化后约 1 毫秒（10-13 测的）。
# 只管依赖，自己的几个 crate 照常不优化，改完重编还是快的。
[profile.dev.package."*"]
opt-level = 2

# 发布用的构建：`cargo build --profile dist -p confdeck-app`，产物在 target/dist/，旁边是 confdeck-app.dSYM。
# 比 release 小一半多，量过的页面响应、滚动、内存都不比 release 差；代价是改一个文件重编要近两分钟，所以平时的 release 不动。
# panic = "abort"：GPUI 的任务、AppKit 的回调里 panic 本来就会让整个应用退出（展开穿不过 C 函数），
# 区别只在 core 自己开的几个线程。
# 符号：带上行号级的调试信息，链接后 rustc 先用 dsymutil 抽成 .dSYM，再去掉二进制里的符号；崩溃报告靠 .dSYM 还原函数名和行号。
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = "s"
panic = "abort"
debug = "line-tables-only"
split-debuginfo = "packed"
strip = true
