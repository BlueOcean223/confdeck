[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
confdeck-core = { path = "crates/core" }

gpui-kit = "0.7"
tray-icon = "0.26"
async-channel = "2"
rust-embed = "8.7"
# 界面文案的多语言。gpui-component 也用它，「当前语言」是进程级的一份，设一次两边的文案都换。
rust-i18n = "4.2"
# 读系统的首选语言，启动时定界面语言。
sys-locale = "0.3"
# 和 gpui 用同一个版本，不多编译一份；只用来把图标渲染成菜单栏图标。
resvg = { version = "0.46", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSScreen", "NSView", "NSWindow", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
raw-window-handle = "0.6"

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
# Pi 的 models.json 允许注释和尾逗号，按 JSON5 读。
json5 = "1"
# 改写 JSON5 / JSONC 文件时保留注释和排版（round-trip 语法树）。
json-five = { version = "0.3.1", default-features = false }
# 写入引擎：文件内容的 hash、备份文件名里的本地时间。
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tempfile = "3"
toml_edit = "0.22"
